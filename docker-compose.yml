services:
  kinora:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      KINORA_DATA_DIR: /app/data
    volumes:
      - kinora-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kinora-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth Deck Style Options</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;800&family=Fredoka:wght@500;600;700&family=Archivo+Black&family=Space+Mono:wght@700&family=Shrikhand&family=Work+Sans:wght@400;600;700&family=Lilita+One&family=Young+Serif&display=swap" rel="stylesheet">
<style>
@page{size:1280px 720px;margin:0}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.t-warm{--a2-ink:#FFFFFF;--bg:#FBF7F1;--surface:#FFFDF9;--ink:#2A211C;--muted:#6F625A;--line:#E8DCCB;--accent:#B4502C;--accent-ink:#FFF;--a2:#4E7A5C;--a3:#6C4E7E;--soft:#F6E3D3;--soft2:#DDEBDF;--head:'Fraunces',Georgia,serif;--body:'Inter',sans-serif;--hw:700;--r:18px}
.t-sage{--a2-ink:#FFFFFF;--bg:#F3F6F2;--surface:#FFF;--ink:#1F2D2A;--muted:#5B6B66;--line:#D5E0D9;--accent:#2F6B57;--accent-ink:#FFF;--a2:#9A5A14;--a3:#3D5A80;--soft:#DCE9E1;--soft2:#F6E7D3;--head:'DM Serif Display',Georgia,serif;--body:'DM Sans',sans-serif;--hw:400;--r:14px}
.t-night{--a2-ink:#1A1426;--bg:#14121F;--surface:#1E1B2E;--ink:#F2EEF8;--muted:#B3ABC6;--line:#332D4D;--accent:#F2A65A;--accent-ink:#1A1426;--a2:#7FD1AE;--a3:#B69CF2;--soft:#2A2540;--soft2:#1F3A33;--head:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--hw:700;--r:16px}
.t-pop{--a2-ink:#FFFFFF;--bg:#FFF8E7;--surface:#FFF;--ink:#1E1B4B;--muted:#57537A;--line:#1E1B4B;--accent:#2D3FE0;--accent-ink:#FFF;--a2:#C8381C;--a3:#7A3FD1;--soft:#FFE9A8;--soft2:#FFD9CF;--head:'Bricolage Grotesque',sans-serif;--body:'Nunito',sans-serif;--hw:800;--r:24px}
.t-trust{--a2-ink:#FFFFFF;--bg:#FFF;--surface:#F6F8FB;--ink:#0F1B2D;--muted:#546179;--line:#E2E8F0;--accent:#1D4ED8;--accent-ink:#FFF;--a2:#0F766E;--a3:#7C3AED;--soft:#E6EEFF;--soft2:#DDF3F0;--head:'Inter',sans-serif;--body:'Inter',sans-serif;--hw:800;--r:10px}

.t-sticker{--a2-ink:#FFFFFF;--bg:#F4FBF7;--surface:#FFFFFF;--ink:#23203A;--muted:#5E5A78;--line:#23203A;--accent:#C9304F;--accent-ink:#FFFFFF;--a2:#1A7A61;--a3:#7A4FD0;--soft:#FFE1EA;--soft2:#D5F3E6;--soft3:#FFF1C2;--head:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;--hw:700;--r:22px;--bw:2px;--shadow:0 5px 0 #23203A}
.t-riso{--a2-ink:#FFFFFF;--bg:#F6F1E7;--surface:#FBF8F1;--ink:#1D2A5C;--muted:#4F5A80;--line:#1D2A5C;--accent:#C8325A;--accent-ink:#FFFFFF;--a2:#0B6E69;--a3:#C8325A;--soft:#FAD3DE;--soft2:#CDEBE6;--soft3:#FDEBB0;--head:'Archivo Black',system-ui,sans-serif;--body:'Space Grotesk',system-ui,sans-serif;--hw:400;--r:4px;--bw:2px;--shadow:5px 5px 0 #C8325A}
.t-retro{--a2-ink:#FFFFFF;--bg:#FBF0DC;--surface:#FFF8EA;--ink:#3B2314;--muted:#6E4F3A;--line:#E4C9A2;--accent:#B04A12;--accent-ink:#FFFFFF;--a2:#566E28;--a3:#8C3B2E;--soft:#F7D9A8;--soft2:#E3E8C6;--soft3:#F2D0C4;--head:'Shrikhand',Georgia,serif;--body:'Work Sans',system-ui,sans-serif;--hw:400;--r:28px;--bw:2px;--shadow:0 2px 0 #E4C9A2}
.t-cartoon{--a2-ink:#FFFFFF;--bg:#DFF3FF;--surface:#FFFFFF;--ink:#111111;--muted:#3D4757;--line:#111111;--accent:#C81E33;--accent-ink:#FFFFFF;--a2:#1C6E34;--a3:#6A3FC8;--soft:#FFF3B0;--soft2:#CDEFD5;--soft3:#FFE0E3;--head:'Lilita One',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;--hw:400;--r:18px;--bw:3px;--shadow:6px 6px 0 #111111}
.t-story{--a2-ink:#FFFFFF;--bg:#F7F1E3;--surface:#FFFCF4;--ink:#2E2A26;--muted:#6B6259;--line:#E3D7BF;--accent:#A8442F;--accent-ink:#FFFFFF;--a2:#4E705D;--a3:#4B6A8A;--soft:#F1DCC9;--soft2:#DCE7DD;--soft3:#DCE3EC;--head:'Young Serif',Georgia,serif;--body:'Nunito',system-ui,sans-serif;--hw:400;--r:26px;--bw:1px;--shadow:0 2px 0 rgba(46,42,38,.06),0 14px 30px rgba(120,90,50,.12)}

.t-sticker .kpi,.t-cartoon .kpi{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.t-sticker .cta{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.t-sticker .blob{border-radius:40%;background:#FFF1C2;border:3px solid #23203A;transform:rotate(-12deg)}.t-sticker .blob2{border-radius:30%;border:3px solid #23203A;transform:rotate(14deg)}
.t-riso{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11 0 0 0 0 0.16 0 0 0 0 0.36 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}.t-riso h1,.t-riso h2{text-shadow:4px 3px 0 rgba(200,50,90,.35)}.t-riso .kick{font-family:'Space Mono',monospace}
.t-riso .kpi{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--accent);border-radius:4px}
.t-riso .blob{border-radius:0;background:repeating-linear-gradient(45deg,#FAD3DE 0 14px,transparent 14px 28px)}.t-riso .blob2{border-radius:0;background:#CDEBE6}
.t-retro .blob{border-radius:0;top:auto;bottom:-2px;right:150px;width:520px;height:260px;background:radial-gradient(circle farthest-side at 50% 100%,#8C3B2E 0 28%,transparent 28% 33%,#C2571A 33% 56%,transparent 56% 61%,#E9A23B 61% 84%,transparent 84%)}.t-retro .blob2{display:none}.t-retro .cta{border-radius:999px}
.t-cartoon{background-image:radial-gradient(#b4dcf5 2px,transparent 2.2px);background-size:22px 22px}
.t-cartoon .cta{border:3px solid #111;box-shadow:4px 4px 0 #111}
.t-cartoon .blob{border-radius:0;background:#FFF3B0;clip-path:polygon(50% 0,61% 32%,95% 22%,72% 50%,98% 76%,62% 70%,50% 100%,38% 70%,2% 76%,28% 50%,5% 22%,39% 32%)}.t-cartoon .blob2{display:none}
.t-story{background-image:radial-gradient(circle at 20% 10%,rgba(168,68,47,.06),transparent 40%),radial-gradient(circle at 85% 80%,rgba(75,106,138,.08),transparent 45%)}
.t-story .blob{border-radius:62% 38% 55% 45%/48% 60% 40% 52%;background:#DCE7DD}.t-story .blob2{border-radius:55% 45% 60% 40%/50% 40% 60% 50%;background:#F1DCC9}
.t-story .kpi{border-radius:30px 22px 34px 20px/22px 32px 20px 30px}
.page{width:1280px;height:720px;page-break-after:always;break-after:page;background:var(--bg);color:var(--ink);font-family:var(--body);position:relative;overflow:hidden;padding:64px 80px;display:flex;flex-direction:column;justify-content:space-between}
.page:last-child{page-break-after:auto;break-after:auto}
h1,h2{font-family:var(--head);font-weight:var(--hw);margin:0;line-height:1.05;letter-spacing:-.015em}
h1{font-size:76px;max-width:900px;position:relative}
h2{font-size:52px;max-width:900px}
.kick{font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800;position:relative}
.sub{font-size:24px;color:var(--muted);max-width:760px;margin-top:20px;position:relative}
.foot{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);position:relative}
.opt{position:absolute;top:22px;right:28px;font:700 13px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:var(--ink);color:var(--bg);z-index:3}
.blob{position:absolute;right:-110px;top:-140px;width:520px;height:520px;border-radius:50%;background:var(--soft)}
.blob2{position:absolute;right:160px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:var(--soft2)}
.t-pop .blob{border-radius:30%;transform:rotate(14deg);border:3px solid var(--ink)}
.t-pop .blob2{border-radius:24px;transform:rotate(-10deg);border:3px solid var(--ink)}
.t-trust .blob{border-radius:0;right:0;top:0;width:380px;height:720px}.t-trust .blob2{display:none}
.t-night .blob{background:radial-gradient(circle,rgba(182,156,242,.45) 0,transparent 65%)}.t-night .blob2{background:radial-gradient(circle,rgba(242,166,90,.35) 0,transparent 65%)}
.cta{display:inline-block;margin-top:28px;padding:16px 26px;border-radius:calc(var(--r) - 6px);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:20px;position:relative}
.t-pop .cta{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.kpis{display:flex;gap:28px}
.kpi{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px}
.t-pop .kpi{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.kpi b{display:block;font-family:var(--head);font-weight:var(--hw);font-size:64px;line-height:1;color:var(--ink)}
.kpi.hl b{color:var(--accent)}
.kpi span{display:block;margin-top:8px;font-size:18px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:18px;height:150px;margin-top:6px}
.bars div{flex:1;background:var(--accent);border-radius:6px 6px 0 0;position:relative;opacity:.9}
.bars div:nth-child(-n+3){opacity:.45}
.bars div span{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:14px;color:var(--ink);font-weight:700}
.bars-l{display:flex;gap:18px;font-size:13px;color:var(--muted)}.bars-l span{flex:1;text-align:center}
</style>
</head>
<body>
<script>
const T=[['warm','Option 1 · Hearth Warm'],['sage','Option 2 · Calm Sage'],['night','Option 3 · Night Feed'],['pop','Option 4 · Playful Pop'],['trust','Option 5 · Clinical Trust'],['sticker','Option 6 · Sticker Club'],['riso','Option 7 · Riso Zine'],['retro','Option 8 · Retro Sunshine'],['cartoon','Option 9 · Saturday Cartoon'],['story','Option 10 · Storybook']];
const arr=[0.324,2.0,6.9,16.1,29.4];
let html='';
T.forEach(([id,name])=>{
 html+=`<section class="page t-${id}"><div class="opt">${name} · title</div><div class="blob"></div><div class="blob2"></div>
  <div class="kick">Business Cup 2.0 · Skills track</div>
  <div><h1>You need a license to drive. Not to raise a human.</h1><div class="sub">Hearth: the Family License, for two. Parenting as a team, from pregnancy to age 12.</div><span class="cta">hearth.app · try it as a guest</span></div>
  <div class="foot"><span><b style="color:var(--ink)">Hearth</b> · Team name</span><span>01</span></div></section>`;
 html+=`<section class="page t-${id}"><div class="opt">${name} · numbers</div>
  <div><div class="kick">Unit economics · base case (market medians)</div><h2 style="margin-top:14px">Each household pays back in 7 months</h2></div>
  <div class="kpis"><div class="kpi hl"><b>1.6×</b><span>LTV / CAC</span></div><div class="kpi"><b>$52</b><span>blended CAC (by channel)</span></div><div class="kpi"><b>$29M</b><span>ARR in Y5 · $107M optimistic</span></div></div>
  <div><div class="bars">${arr.map((v,i)=>`<div style="height:${Math.max(6,v/29.4*100)}%"><span>$${v<1?Math.round(v*1000)+'K':v+'M'}</span></div>`).join('')}</div><div class="bars-l">${arr.map((_,i)=>`<span>Y${i+1}</span>`).join('')}</div></div>
  <div class="foot"><span>Sources: RevenueCat State of Subscription Apps 2026 · Adapty Meta Ads Q3 2026</span><span>08</span></div></section>`;
});
document.body.innerHTML=html;
</script>
</body>
</html>
